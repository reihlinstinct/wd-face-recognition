name: bench-ncnn

on:
  pull_request:
    paths: ["bench/ncnn/**", ".github/workflows/bench-ncnn.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ncnn-spike:
    name: ncnn pipeline spike (issue #3)
    runs-on: ubuntu-24.04
    container:
      image: debian:11
      options: --memory=4g --cpus=2
    steps:
      - name: Install build tools
        run: |
          # Debian 11 (Bullseye) is EOL: its suites live on archive.debian.org.
          printf 'deb http://archive.debian.org/debian bullseye main\n' \
            > /etc/apt/sources.list
          printf 'deb http://archive.debian.org/debian-security bullseye-security main\n' \
            >> /etc/apt/sources.list
          echo 'Acquire::Check-Valid-Until "false";' \
            > /etc/apt/apt.conf.d/99no-check-valid-until
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl file git unzip pkg-config \
            libjpeg62-turbo-dev libheif-dev libheif-examples \
            protobuf-compiler libprotobuf-dev python3 python3-pip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python deps
        run: python3 -m pip install --no-cache-dir pillow onnx-simplifier==0.4.36

      - name: Cache the ncnn build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ncnn-build
          key: ncnn-20261020-noavx-v2

      - name: Build ncnn (static, no AVX) + onnx2ncnn
        run: bench/ncnn/build-ncnn.sh /tmp/ncnn-build

      - name: Fetch + convert models (buffalo_s, pinned)
        run: bench/ncnn/get-models.sh /tmp/wdf-models /tmp/ncnn-build/install

      - name: Build the benchmark
        run: |
          cmake -S bench/ncnn -B build/bench-ncnn -DCMAKE_BUILD_TYPE=Release \
            -DNCNN_INSTALL_DIR=/tmp/ncnn-build/install
          cmake --build build/bench-ncnn --parallel

      - name: Generate synthetic assets
        run: |
          python3 bench/assets/gen_assets.py /tmp/wdf-bench-assets
          python3 - <<'PY'
          from PIL import Image
          img = Image.open('/tmp/wdf-bench-assets/photo_12mp.jpg')
          img.crop((0, 0, 112, 112)).save('/tmp/wdf-bench-assets/crop112.jpg', 'JPEG', quality=95)
          print('crop112.jpg written')
          PY
          heif-enc /tmp/wdf-bench-assets/photo_12mp.jpg -o /tmp/wdf-bench-assets/photo_12mp.heic \
            && echo "heic sample encoded" || echo "heif-enc unavailable - HEIC step will be skipped"

      - name: Run the spike
        run: python3 bench/ncnn/run_ncnn_bench.py build/bench-ncnn/bench_ncnn /tmp/wdf-bench-assets /tmp/wdf-models

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-ncnn-results
          path: docs/BENCHMARK.md

  summary:
    permissions:
      contents: read
    name: Run summary
    if: always()
    needs: [ncnn-spike]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write run summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/run_summary.py
