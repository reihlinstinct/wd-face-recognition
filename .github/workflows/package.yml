name: package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  apkg:
    name: Build apkg (.bin) for My Cloud PR4100
    runs-on: ubuntu-24.04
    container: debian:11
    steps:
      - name: Install build tools
        run: |
          # Debian 11 (Bullseye) is EOL: its suites live on archive.debian.org.
          printf 'deb http://archive.debian.org/debian bullseye main\n' \
            > /etc/apt/sources.list
          printf 'deb http://archive.debian.org/debian-security bullseye-security main\n' \
            >> /etc/apt/sources.list
          echo 'Acquire::Check-Valid-Until "false";' \
            > /etc/apt/apt.conf.d/99no-check-valid-until
          # archive.debian.org (EOL bullseye) flakes on individual fetches:
          # retry the update+install so one bad download does not kill the
          # build (issue: package job died on a transient protobuf fetch).
          # Both halves inside the `if`: a standalone `apt-get update`
          # failure would abort the -e shell without retrying (the class
          # of flake this loop exists to survive).
          for attempt in 1 2 3; do
            if apt-get update && \
                DEBIAN_FRONTEND=noninteractive apt-get install -y \
                --no-install-recommends --fix-missing \
                build-essential ca-certificates cmake curl file git unzip \
                pkg-config libjpeg62-turbo-dev protobuf-compiler \
                libprotobuf-dev python3 python3-pip; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
      # Checkout after git is installed: debian:11 has no git by default.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (stable, musl target)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable \
              --target x86_64-unknown-linux-musl
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

      - name: Install Python deps (model conversion)
        run: python3 -m pip install --no-cache-dir onnx-simplifier==0.4.36

      - name: Cache the ncnn build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ncnn-build
          key: ncnn-20261020-noavx-v2

      - name: Build the apkg package
        run: packaging/build-apkg.sh

      - name: Verify the .bin package (signature, layout, fields)
        # Regression gate (issue #22): empty apkg.sign, wrong payload root dir,
        # header/apkg.rc mismatches and a non-running demo binary all fail here.
        run: packaging/verify-apkg.sh

      - name: Upload the apkg package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wd-face-recognition-apkg
          path: packages/*.bin
          retention-days: 14

  summary:
    permissions:
      contents: read
    name: Run summary
    if: always()
    needs: [apkg]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write run summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/run_summary.py
