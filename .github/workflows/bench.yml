name: bench

on:
  pull_request:
    paths: ["bench/**", ".github/workflows/bench.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shootout:
    name: Language shootout (issue #14)
    runs-on: ubuntu-24.04
    container:
      image: debian:11
      options: --memory=4g --cpus=2
    steps:
      - name: Install build tools
        run: |
          # Debian 11 (Bullseye) is EOL: its suites live on archive.debian.org.
          printf 'deb http://archive.debian.org/debian bullseye main\n' \
            > /etc/apt/sources.list
          printf 'deb http://archive.debian.org/debian-security bullseye-security main\n' \
            >> /etc/apt/sources.list
          echo 'Acquire::Check-Valid-Until "false";' \
            > /etc/apt/apt.conf.d/99no-check-valid-until
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl file git pkg-config time \
            libssl-dev libjpeg62-turbo-dev libexiv2-dev libsqlite3-dev \
            nlohmann-json3-dev python3 python3-pip python3-venv nasm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (stable)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

      - name: Install Python deps
        run: python3 -m pip install --no-cache-dir pillow

      - name: Fetch cpp-httplib (pinned, checksummed)
        run: |
          mkdir -p bench/cpp/third_party
          curl -fsSL -o bench/cpp/third_party/httplib.h \
            https://raw.githubusercontent.com/yhirose/cpp-httplib/v0.15.3/httplib.h
          echo "a3347656c71c81c3fe510fdb1ff229d7db52eb7df04d3342d340eba0b6ad50ea  bench/cpp/third_party/httplib.h" \
            | sha256sum --check || { echo "httplib.h checksum mismatch"; exit 1; }

      - name: Build C++ bench
        run: |
          cmake -S bench/cpp -B build/bench-cpp -DCMAKE_BUILD_TYPE=Release
          cmake --build build/bench-cpp --parallel

      - name: Build Rust bench
        run: cargo build --release --manifest-path bench/rust/Cargo.toml --target-dir build/bench-rust

      - name: Run the shootout
        run: bench/run_suite.sh

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-language-results
          path: docs/BENCHMARK-LANGUAGE.md

  summary:
    permissions:
      contents: read
    name: Run summary
    if: always()
    needs: [shootout]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write run summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/run_summary.py
