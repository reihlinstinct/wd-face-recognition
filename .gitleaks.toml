# Vendored third-party code only. indexer/third_party holds the SQLite
# amalgamation fetched by indexer/get-sqlite.sh (sha256-pinned); gitleaks'
# generic-api-key rule flags its sqlite3_api->... struct accesses. These
# are not secrets. Everything else in the repo is scanned as usual.
[allowlist]
paths = ['''^indexer/third_party/.*''']  # anchored: nested lookalikes stay scanned
